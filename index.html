                          <option value="">{t.contact.budgetPh}</option>

                        </select>
                      </div>
                      <div>
                        <div className="flex justify-between items-end mb-2">
                          <label className="block text-sm font-medium text-slate-700">{t.contact.note}</label>
                          <button type="button" onClick={handleExpandNotes} disabled={isExpandingNotes || !formData.notes} className="text-xs font-medium text-orange-600 hover:text-orange-700 flex items-center disabled:opacity-50 disabled:cursor-not-allowed bg-orange-50 px-2 py-1 rounded-md transition-colors">
                            {isExpandingNotes ? <i className="fa-solid fa-spinner fa-spin text-[12px] mr-1"></i> : <i className="fa-solid fa-wand-magic-sparkles text-[12px] mr-1"></i>}
                            {t.contact.btnAi}
                          </button>
                        </div>
                        <textarea rows="4" value={formData.notes} onChange={(e) => setFormData({ notes: e.target.value })} className="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-orange-500 outline-none transition-all text-slate-900 resize-none" placeholder={t.contact.notePh}></textarea>
                      </div>
                      <button type="button" className="w-full py-4 bg-orange-600 hover:bg-orange-700 text-white font-bold rounded-lg transition-colors shadow-lg hover:shadow-xl">
                        {t.contact.btnSubmit}
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </section>

          <footer className="bg-slate-950 text-slate-500 py-8 text-center text-sm border-t border-slate-800">
            <p>&copy; {new Date().getFullYear()} {t.footer}</p>
          </footer>

          <div className="fixed bottom-6 right-6 z-50 group">
            <button className="bg-green-500 hover:bg-green-600 text-white w-14 h-14 rounded-full flex items-center justify-center shadow-2xl transition-transform transform hover:scale-110">
              <i className="fa-brands fa-whatsapp text-[28px]"></i>
            </button>
            <div className="absolute right-16 top-1/2 -translate-y-1/2 px-3 py-2 bg-slate-900 text-white text-sm rounded-lg opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap shadow-lg">
              {t.fab}
            </div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
