                    <i className="fa-solid fa-layer-group text-purple-600 text-[28px]"></i>
                  </div>
                  <h3 className="text-xl font-bold text-slate-900 mb-3">{t.whyUs.cards[2].title}</h3>
                  <p className="text-slate-600 leading-relaxed" dangerouslySetInnerHTML={{__html: t.whyUs.cards[2].desc}}></p>
                </div>
              </div>
            </div>
          </section>

          {/* Services */}
          <section id="services" className="py-24 bg-white">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="mb-16 md:flex md:justify-between md:items-end">
                <div className="max-w-2xl">
                  <h2 className="text-3xl md:text-4xl font-bold text-slate-900 mb-4">{t.services.title}</h2>
                  <p className="text-slate-600 text-lg">{t.services.desc}</p>
                </div>
                <a href="#contact" className="hidden md:inline-flex items-center font-semibold text-orange-600 hover:text-orange-700">
                  {t.services.btnQuote} <i className="fa-solid fa-chevron-right text-[16px] ml-1"></i>
                </a>
              </div>

              <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                {[
                  { icon: "fa-mobile-screen", i: 0 }, { icon: "fa-map", i: 1 }, 
                  { icon: "fa-video", i: 2 }, { icon: "fa-microphone", i: 3 }, { icon: "fa-table-columns", i: 4 }
                ].map((item) => (
                  <div key={item.i} className="p-6 border border-slate-100 rounded-2xl hover:border-orange-200 hover:bg-orange-50/30 transition-colors">
                    <i className={`fa-solid ${item.icon} text-[40px] text-slate-700 mb-4`}></i>
                    <h4 className="text-lg font-bold text-slate-900 mb-2">{t.services.cards[item.i].title}</h4>
                    <p className="text-slate-500 text-sm leading-relaxed">{t.services.cards[item.i].desc}</p>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* Portfolio */}
          <section id="portfolio" className="py-24 bg-slate-50">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="text-center mb-12">
                <h2 className="text-3xl md:text-4xl font-bold text-slate-900 mb-4">{t.portfolio.title}</h2>
                <p className="text-slate-600 text-lg">{t.portfolio.desc}</p>
              </div>

              <div className="flex flex-wrap justify-center gap-3 mb-12">
                {[
                  { id: 'all', label: t.portfolio.filters.all },
                  { id: 'game', label: t.portfolio.filters.game },
                  { id: 'fmcg', label: t.portfolio.filters.fmcg },
                  { id: 'event', label: t.portfolio.filters.event },
                  { id: 'web', label: t.portfolio.filters.web },
                ].map(filter => (
                  <button
                    key={filter.id}
                    onClick={() => setActiveFilter(filter.id)}
                    className={`px-5 py-2 rounded-full text-sm font-medium transition-all ${
                      activeFilter === filter.id 
                        ? 'bg-slate-900 text-white shadow-md' 
                        : 'bg-white text-slate-600 hover:bg-slate-200 border border-slate-200'
                    }`}
                  >
                    {filter.label}
                  </button>
                ))}
              </div>

              <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
                {filteredPortfolio.map(item => (
                  <div key={item.id} className="group cursor-pointer bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-all border border-slate-100">
                    <div className="h-48 flex items-center justify-center relative overflow-hidden bg-slate-100">
                      <img src={item.image} className="absolute inset-0 w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" />
                      <div className="absolute inset-0 bg-slate-900/20 group-hover:bg-transparent transition-colors duration-500"></div>
                    </div>
                    <div className="p-6">
                      <h3 className="text-xl font-bold text-slate-900 mb-2 group-hover:text-orange-600 transition-colors">{item.title}</h3>
                      <p className="text-slate-600 text-sm line-clamp-2">{item.desc}</p>
                    </div>
                  </div>
                ))}
              </div>

              <div className="mt-24 pt-16 border-t border-slate-200">
                <p className="text-center text-sm font-semibold text-slate-500 tracking-wider mb-8 uppercase">{t.portfolio.logoTitle}</p>
                <div className="flex flex-wrap justify-center items-center gap-8 md:gap-12 transition-all duration-500">
                  {[
                    { src: 'logos/c1.jpg', alt: '中信銀行' },
                    { src: 'logos/c2.jpg', alt: 'BCT 銀聯集團' },
                    { src: 'logos/c3.jpg', alt: '道' },
                    { src: 'logos/c4.jpg', alt: 'ByteDance 字节跳动' },
                    { src: 'logos/c5.jpg', alt: 'KOMOE' },
                    { src: 'logos/c6.jpg', alt: '智冠科技' },
                    { src: 'logos/c7.jpg', alt: '7SENSES' },
                    { src: 'logos/c8.jpg', alt: 'AIDS CONCERN 關懷愛滋' },
                    { src: 'logos/c9.jpg', alt: 'Alibaba.com' },
                    { src: 'logos/c10.jpg', alt: 'efunfun' }
                  ].map((logo, idx) => (
                    <img key={idx} src={logo.src} alt={logo.alt} className="h-10 md:h-14 object-contain opacity-60 grayscale hover:opacity-100 hover:grayscale-0 transition-all duration-300" />
                  ))}
                </div>
              </div>
            </div>
          </section>

          {/* About Us */}
          <section id="about" className="py-24 bg-white overflow-hidden">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="lg:grid lg:grid-cols-2 lg:gap-16 items-center">
                <div className="mb-12 lg:mb-0 relative">
                  <div className="aspect-square rounded-full bg-orange-50 absolute -top-12 -left-12 w-64 h-64 -z-10"></div>
                  <div className="bg-slate-100 rounded-3xl h-96 w-full flex items-center justify-center relative overflow-hidden shadow-lg group">
                    <img src="https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?auto=format&fit=crop&q=80&w=1000" className="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" />
                    <div className="absolute inset-0 bg-gradient-to-t from-slate-900/50 to-transparent"></div>
                    <div className="absolute bottom-6 left-6 right-6 bg-white/95 backdrop-blur p-6 rounded-2xl shadow-xl transform translate-y-2 group-hover:translate-y-0 transition-transform duration-500">
                       <p className="font-bold text-slate-900 text-lg mb-1">{t.about.est}</p>
                       <p className="text-orange-600 font-medium">{t.about.estSub}</p>
                    </div>
                  </div>
                </div>
                
                <div>
                  <h2 className="text-3xl md:text-4xl font-bold text-slate-900 mb-6">{t.about.title}</h2>
                  <p className="text-slate-600 text-lg leading-relaxed mb-8">{t.about.desc}</p>
                  
                  <div className="space-y-6">
                    {t.about.depts.map((dept, idx) => (
                      <div className="flex" key={idx}>
                        <div className="flex-shrink-0 mt-1"><div className="w-2 h-2 rounded-full bg-orange-600"></div></div>
                        <div className="ml-4">
                          <h4 className="text-lg font-bold text-slate-900">{dept.title}</h4>
                          <p className="text-slate-600 text-sm mt-1">{dept.desc}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* Contact Us */}
          <section id="contact" className="py-24 bg-slate-900 text-white">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="lg:grid lg:grid-cols-12 lg:gap-16">
                <div className="lg:col-span-5 mb-16 lg:mb-0">
                  <h2 className="text-3xl md:text-4xl font-bold mb-6">{t.contact.title}</h2>
                  <p className="text-slate-400 mb-10 text-lg">{t.contact.desc}</p>

                  <div className="space-y-8">
                    <div className="bg-slate-800/50 p-6 rounded-2xl border border-slate-700">
                      <h4 className="text-orange-400 font-bold mb-4 flex items-center">
                        <i className="fa-solid fa-location-dot text-[20px] mr-2"></i> {t.contact.hq}
                      </h4>
                      <p className="text-slate-300 text-sm mb-2">{t.contact.hqAddr}</p>
                      <p className="text-slate-300 text-sm flex items-center"><i className="fa-solid fa-phone text-[16px] mr-2"></i> +852 3111 2328</p>
                    </div>

                    <div className="bg-slate-800/50 p-6 rounded-2xl border border-slate-700">
                      <h4 className="text-orange-400 font-bold mb-4 flex items-center">
                        <i className="fa-solid fa-location-dot text-[20px] mr-2"></i> {t.contact.tw}
                      </h4>
                      <p className="text-slate-300 text-sm mb-2">{t.contact.twAddr}</p>
                      <p className="text-slate-300 text-sm flex items-center"><i className="fa-solid fa-phone text-[16px] mr-2"></i> +886 2 7708 0766</p>
                    </div>

                    <div className="flex items-center text-slate-300 hover:text-white transition-colors">
                      <i className="fa-solid fa-envelope text-[20px] mr-3 text-orange-400"></i>
                      <a href="mailto:enquiry@act-m.com" className="text-lg">enquiry@act-m.com</a>
                    </div>
                  </div>
                </div>

                <div className="lg:col-span-7">
                  <form className="bg-white rounded-3xl p-8 shadow-2xl">
                    <h3 className="text-2xl font-bold text-slate-900 mb-6">{t.contact.formTitle}</h3>
                    <div className="space-y-6">
                      <div className="grid md:grid-cols-2 gap-6">
                        <div>
                          <label className="block text-sm font-medium text-slate-700 mb-2">{t.contact.company}</label>
                          <input type="text" className="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition-all text-slate-900" placeholder={t.contact.companyPh} />
                        </div>
                        <div>
                          <label className="block text-sm font-medium text-slate-700 mb-2">{t.contact.name}</label>
                          <input type="text" className="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition-all text-slate-900" placeholder={t.contact.namePh} />
                        </div>
                      </div>
                      <div className="grid md:grid-cols-2 gap-6">
                        <div>
                          <label className="block text-sm font-medium text-slate-700 mb-2">{t.contact.email}</label>
                          <input type="email" className="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition-all text-slate-900" placeholder={t.contact.emailPh} />
                        </div>
                        <div>
                          <label className="block text-sm font-medium text-slate-700 mb-2">{t.contact.phone}</label>
                          <input type="tel" className="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition-all text-slate-900" placeholder={t.contact.phonePh} />
                        </div>
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-slate-700 mb-2">{t.contact.service}</label>
                        <select className="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition-all text-slate-900 bg-white">
                          <option value="">{t.contact.servicePh}</option>
                          {t.contact.services.map((opt, i) => <option key={i} value={i}>{opt}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-slate-700 mb-2">{t.contact.budget}</label>
                        <select className="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition-all text-slate-900 bg-white">
                          <option value="">{t.contact.budgetPh}</option>
                          {t.contact.budgets.map((opt, i) => <option key={i} value={i}>{opt}</option>)}
                        </select>
                      </div>
                      <div>
                        <div className="flex justify-between items-end mb-2">
                          <label className="block text-sm font-medium text-slate-700">{t.contact.note}</label>
                          <button type="button" onClick={handleExpandNotes} disabled={isExpandingNotes || !formData.notes} className="text-xs font-medium text-orange-600 hover:text-orange-700 flex items-center disabled:opacity-50 disabled:cursor-not-allowed bg-orange-50 px-2 py-1 rounded-md transition-colors">
                            {isExpandingNotes ? <i className="fa-solid fa-spinner fa-spin text-[12px] mr-1"></i> : <i className="fa-solid fa-wand-magic-sparkles text-[12px] mr-1"></i>}
                            {t.contact.btnAi}
                          </button>
                        </div>
                        <textarea rows="4" value={formData.notes} onChange={(e) => setFormData({ notes: e.target.value })} className="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition-all text-slate-900 resize-none" placeholder={t.contact.notePh}></textarea>
                      </div>
                      <button type="button" className="w-full py-4 bg-orange-600 hover:bg-orange-700 text-white font-bold rounded-lg transition-colors shadow-lg hover:shadow-xl">
                        {t.contact.btnSubmit}
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </section>

          {/* Footer */}
          <footer className="bg-slate-950 text-slate-500 py-8 text-center text-sm border-t border-slate-800">
            <p>&copy; {new Date().getFullYear()} {t.footer}</p>
          </footer>

          {/* Floating Action Button */}
          <div className="fixed bottom-6 right-6 z-50 group">
            <button className="bg-green-500 hover:bg-green-600 text-white w-14 h-14 rounded-full flex items-center justify-center shadow-2xl transition-transform transform hover:scale-110">
              <i className="fa-brands fa-whatsapp text-[28px]"></i>
            </button>
            <div className="absolute right-16 top-1/2 -translate-y-1/2 px-3 py-2 bg-slate-900 text-white text-sm rounded-lg opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap shadow-lg">
              {t.fab}
            </div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
